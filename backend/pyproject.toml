[project]
name = "atlas-api"
version = "0.1.0"
description = "API do Atlas — orquestração de rotas, catálogo de lugares e chaves fora do aplicativo."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    # Random Forest de recomendação (backend/ml/ treina, app/ml/ serve).
    "scikit-learn>=1.5",
    "numpy>=2.0",
    # Fuso horário de Brasília no Windows, onde o sistema não traz a base IANA.
    "tzdata>=2024.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
]
vision = [
    "pillow>=11",
    "torch>=2.6",
    "transformers>=4.50",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
